services:
  postgres:
    image: postgres:16-alpine
    container_name: soulmate_postgres
    environment:
      POSTGRES_USER: soulmate
      POSTGRES_PASSWORD: soulmate_dev_password
      POSTGRES_DB: soulmate_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soulmate -d soulmate_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
